# /etc/nginx/sites-available/olympia-g3.pbbgaming.com
# Static Hugo build served under /docs of olympia-g3.pbbgaming.com
# (Hugo baseURL = https://olympia-g3.pbbgaming.com/docs).
#
# Deploy model: the repo is checked out on the server at
# /opt/olyg3/olympia-g3, and `tools/deploy.sh` (installed as
# /opt/olyg3/deploy.sh) pulls and rebuilds Hugo's output in place at
# /opt/olyg3/olympia-g3/site/public. Nginx serves that directory directly under
# /docs/ via `alias`, so no separate copy/rsync step is needed.
#
# TLS (certbot / `listen 443`) is assumed to be added separately.

server {
    server_name olympia-g3.pbbgaming.com;

    # Send bare /docs to /docs/ so relative asset paths resolve.
    location = /docs {
        return 301 /docs/;
    }

    # The documentation site (static Hugo output, served from the checkout).
    # `alias` maps the /docs/ URL prefix onto the Hugo public/ directory, so
    # /docs/css/x resolves to .../site/public/css/x.
    location /docs/ {
        alias /opt/olyg3/olympia-g3/site/public/;
        index index.html;
        try_files $uri $uri/ =404;

        # Long-cache Hugo's fingerprinted assets; HTML stays revalidated.
        location ~* \.(?:css|js|woff2?|png|jpe?g|svg|ico|webp)$ {
            expires    30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
